<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">PRAEFATIO</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il compito del difensore</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Prefazione di Silas Ravenshaw</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La difesa non comincia dalla formula più forte. Comincia dalla comprensione di ciò che sta</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">accadendo: un effetto, una persona esposta, un luogo che può rendere migliore o peggiore</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">ogni decisione.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Questo volume accompagna sette annualità, ciascuna di due settimane con due lezioni a</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">settimana. I ventotto incontri collegano le formule del repertorio a paura, creature, oggetti</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">sospetti e responsabilità. Ogni lezione comprende spiegazione, nozioni e confronto in aula.</text><text x="52" y="316" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Comprendere prima di scegliere</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Una stessa manifestazione può avere conseguenze diverse in condizioni differenti. La</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">precisione consiste nel riconoscere il bersaglio, definire un risultato necessario e controllare</text><text x="52" y="376" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">che l’intervento non produca un problema più grande.</text><rect x="52" y="394" width="491" height="71" fill="#eee9d8"/><path d="M52 394v71" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="409" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">HOGWARTS · 1890</text><text x="66" y="430" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Conoscenza, esecuzione e autorizzazione sono distinte. La lettura non assegna capacità</text><text x="66" y="446" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">avanzate e non sostituisce la valutazione del docente.</text><text x="52" y="484" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Conservate negli appunti anche i limiti delle risposte. Un giudizio affidabile non nasconde ciò che</text><text x="52" y="502" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">resta incerto e non scambia la prudenza per mancanza di coraggio.</text><text x="52" y="532" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#354451" font-style="italic">Silas Ravenshaw</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">02</text></svg>