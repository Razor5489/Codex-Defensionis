<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola III · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Riddikulus</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno III · Lezione 3 · pagina 42</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Contrasta un Molliccio trasformandone l’apparenza in qualcosa di comico, sostenuto</text><text x="52" y="249" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">dall’immaginazione di chi lo affronta.</text><text x="52" y="277" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Il rapporto fra paura, immagine mentale e comicità è centrale. La formula non è una trasformazione</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">universale di qualunque creatura.</text><text x="52" y="326" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Expulso</text><text x="52" y="350" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno IV · Lezione 1 · pagina 50</text><text x="52" y="375" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Produce un effetto esplosivo sul bersaglio o nel punto colpito.</text><text x="52" y="403" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Esplosione e spinta direzionale non sono equivalenti. La descrizione generale non stabilisce raggio,</text><text x="52" y="418" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">danno o materiali coinvolti nella versione della scuola.</text><text x="52" y="452" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Confringo</text><text x="52" y="476" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno IV · Lezione 2 · pagina 53</text><text x="52" y="501" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Provoca un’esplosione nel punto o sul bersaglio raggiunto dalla formula.</text><text x="52" y="529" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Va distinto da Incendio, studiato per la produzione di fuoco. La classificazione offensiva e le condizioni</text><text x="52" y="544" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">d’impiego appartengono alla lezione di D.C.A.O.</text><text x="52" y="578" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Confundo</text><text x="52" y="602" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno V · Lezione 1 · pagina 64</text><text x="52" y="627" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Confonde il bersaglio, alterandone temporaneamente la lucidità o la valutazione della situazione.</text><text x="52" y="655" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Confusione, cancellazione della memoria e controllo delle azioni non sono lo stesso effetto. Occorre</text><text x="52" y="670" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">descrivere il cambiamento effettivamente osservato.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">109</text></svg>