<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola II · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Riddikulus</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno II · Lezione 2 · pagina 25</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Contrasta un Molliccio trasformandone l’apparenza in qualcosa di comico, sostenuto</text><text x="52" y="249" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">dall’immaginazione di chi lo affronta.</text><text x="52" y="277" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">La forma osservata dipende dall’incontro e non definisce un aspetto stabile noto.</text><text x="52" y="311" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Coloshoo</text><text x="52" y="335" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno II · Lezione 2 · pagina 25</text><text x="52" y="360" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Incolla o fissa le scarpe del bersaglio al terreno, ostacolandone lo spostamento.</text><text x="52" y="388" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Il punto d’azione è essenziale per distinguere la formula da un’immobilizzazione generale.</text><text x="52" y="422" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Tarantallegra</text><text x="52" y="446" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno II · Lezione 3 · pagina 28</text><text x="52" y="471" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Costringe le gambe del bersaglio a un movimento incontrollato simile a una danza.</text><text x="52" y="499" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">L’effetto descritto riguarda le gambe, non ogni azione della persona.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">109</text></svg>