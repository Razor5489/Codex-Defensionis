<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · LECTIO 1</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Fireball · Scheda della lezione</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Una manifestazione più vistosa è necessariamente una difesa migliore?</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">1. Leggere il caso immaginario predisposto dal docente.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">2. Individuare persone, materiali e vie di allontanamento.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">3. Motivare se una risposta incendiaria sia proporzionata.</text><text x="52" y="333" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Domanda di ripasso</text><text x="52" y="357" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Perché il difensore deve osservare anche ciò che circonda il bersaglio?</text><text x="52" y="393" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Risposta ragionata</text><text x="52" y="417" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Perché il fuoco può coinvolgere l’ambiente e trasformare una scelta apparentemente efficace in un</text><text x="52" y="433" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">nuovo pericolo.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">38</text></svg>