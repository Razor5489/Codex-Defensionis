<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">CONSILIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Scegliere una difesa</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Una decisione proporzionata alla situazione</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Riconoscere</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Descrivere ciò che si vede prima di attribuirgli una causa. Distinguere un movimento, un effetto</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">magico e una reazione di paura.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Proteggere</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Individuare persone esposte e possibilità di allontanamento. Una formula difensiva richiede</text><text x="52" y="302" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">comunque direzione, attenzione e condizioni adatte.</text><text x="52" y="338" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Interrompere</text><text x="52" y="362" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Disarmare, sbilanciare e distrarre producono risultati diversi. Scegliere in rapporto al problema,</text><text x="52" y="379" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">senza confondere la varietà delle formule con la qualità del giudizio.</text><text x="52" y="415" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Verificare</text><text x="52" y="439" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Osservare ciò che è cambiato. Un effetto visibile non dimostra da solo che il pericolo sia</text><text x="52" y="456" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">concluso.</text><rect x="52" y="473" width="491" height="71" fill="#eee9d8"/><path d="M52 473v71" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="488" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">CASO IMMAGINARIO</text><text x="66" y="509" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Un compagno perde la bacchetta mentre un altro arretra verso una scala. La classe discute</text><text x="66" y="525" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">prima le persone esposte e lo spazio disponibile, poi le formule eventualmente pertinenti.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">105</text></svg>