<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">I Dissennatori</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Riconoscere una minaccia diversa dal duello</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">I Dissennatori sono associati a freddo innaturale e a un profondo impoverimento delle</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">emozioni positive. Il pericolo non si misura soltanto attraverso un colpo fisico o una ferita</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">visibile.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La minaccia chiamata bacio del Dissennatore riguarda la sottrazione dell’anima. Il tema</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">viene affrontato sul piano teorico, senza dimostrazioni con la creatura. Il Patronus è studiato</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">come difesa specifica, non come proprietà trasferita a ogni scudo.</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Il repertorio menziona anche i Lethifold fra le entità per le quali il Patronus è rilevante.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Questo confronto non rende tutte le creature oscure identiche. L’assistenza dopo</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">un’esposizione e la difesa durante l’incontro sono compiti distinti.</text><text x="52" y="375" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Silas Ravenshaw · Appunti per il corso di Difesa</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">78</text></svg>