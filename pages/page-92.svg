<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Gli Obscuriali</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La persona e la manifestazione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Si chiama Obscuriale un giovane mago o una giovane strega in cui una repressione</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">profonda delle capacità magiche ha dato origine a un Obscurus. Il fenomeno è raro e grave;</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">non va confuso con la normale esitazione nell’apprendere o con un episodio di magia</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">accidentale.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Obscuriale indica la persona; Obscurus indica la manifestazione oscura legata alla magia</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">repressa, che può assumere caratteri distruttivi. Confondere i due termini favorisce il</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">pregiudizio e porta a trattare una persona vulnerabile soltanto come una minaccia.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Questo studio è teorico. Un sospetto non autorizza interrogatori, prove o tentativi di</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">provocare una manifestazione. La responsabilità della scuola consiste nel proteggere le</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">persone e coinvolgere figure competenti. Non viene presentata una formula risolutiva</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">universale né si deduce una condizione dal solo comportamento riservato.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Silas Ravenshaw · Appunti per il corso di Difesa</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">92</text></svg>