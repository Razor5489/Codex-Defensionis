<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · LECTIO 4</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Le nozioni da ricordare</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Incarcerous</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Effetto</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Evoca corde che avvolgono il bersaglio e ne limitano i movimenti. Il contenimento è</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">distinto dallo sbilanciamento e dal disarmo: trattenere non significa automaticamente aver</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">concluso il pericolo.</text><text x="52" y="281" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Conseguenze</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Le corde possono produrre cadute o compressioni. La disposizione del bersaglio e la</text><text x="52" y="323" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">possibilità di interrompere il contenimento fanno parte della valutazione, senza trasformare</text><text x="52" y="341" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">una formula in un diritto di trattenere chiunque.</text><text x="52" y="378" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Applicazione difensiva</text><text x="52" y="402" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Lo scopo va motivato e il risultato verificato nel contesto.</text><rect x="52" y="420" width="491" height="55" fill="#eee9d8"/><path d="M52 420v55" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="435" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">DOMANDA DA DISCUTERE</text><text x="66" y="456" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Ottenere l’effetto desiderato basta a rendere corretta la scelta?</text><text x="52" y="494" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76">Per motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione</text><text x="52" y="512" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76">ragionata può essere discussa; una notizia nuova richiede una fonte.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">74</text></svg>