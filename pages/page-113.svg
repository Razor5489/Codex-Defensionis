<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">NOTA DELL’EDIZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">I materiali del volume</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Una rielaborazione per l’insegnamento</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Le fonti di partenza</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Il libro D.C.A.O. disponibile sul sito di Francis Lake e il documento DCAO fornito per questa</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">edizione hanno ispirato la progressione fra formule, creature e temi difensivi. Testi, casi e schede di</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">lezione sono rielaborati per questo corso.</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Riferimento web: francislake.altervista.org · Libro DCAO.php</text><text x="52" y="311" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">La ripartizione scolastica</text><text x="52" y="335" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">La selezione considera il repertorio in gioco e la divisione delle altre materie. Protego, Flipendo e</text><text x="52" y="353" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Rictusempra riprendono il primo anno già svolto; la collocazione successiva è una proposta</text><text x="52" y="371" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">didattica, non un requisito tecnico verificato del gioco.</text><text x="52" y="408" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">L’orizzonte del volume</text><text x="52" y="432" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">L’ambientazione è Hogwarts nel 1890. Non si utilizzano avvenimenti successivi o rimedi futuri</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">come conoscenze disponibili. Le informazioni incomplete sono dichiarate senza attribuire proprietà</text><text x="52" y="468" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">aggiuntive alle formule.</text><text x="52" y="505" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">L’edizione</text><text x="52" y="529" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Silas Ravenshaw è un autore fittizio. I casi immaginari servono alla discussione in aula e non</text><text x="52" y="547" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">introducono regole nuove nel repertorio della scuola.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">113</text></svg>