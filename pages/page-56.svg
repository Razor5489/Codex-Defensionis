<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 3 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Confringo</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Potenza e responsabilità del risultato</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Provoca un’esplosione nel punto o sul bersaglio raggiunto dalla formula. Si conserva la</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">distinzione tra descrizione di un effetto offensivo e decisione di impiegarlo. La sua presenza</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">nel programma non autorizza prove libere sull’ambiente.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Va distinto da Incendio, studiato per la produzione di fuoco. La classificazione offensiva e</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">le condizioni d’impiego appartengono alla lezione di D.C.A.O.</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Il confronto con Expulso non introduce differenze numeriche che i materiali non</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">stabiliscono. Entrambe le voci richiedono di ragionare su ciò che può essere coinvolto oltre</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">al bersaglio. La riuscita difensiva non coincide con il danno più grande possibile.</text><text x="52" y="357" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Silas Ravenshaw · Appunti per il corso di Difesa</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">56</text></svg>