<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · LECTIO 3</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Le nozioni da ricordare</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Bombarda e Confringo</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Bombarda</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Studiare il punto colpito e le conseguenze dell’esplosione sui materiali vicini.</text><text x="52" y="245" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Confringo</text><text x="52" y="269" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Distinguere la manifestazione offensiva dal giudizio sulla necessità di impiegarla.</text><text x="52" y="306" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Confronto</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Non dedurre portata, precisione o superiorità di una formula dalla sola somiglianza dei</text><text x="52" y="348" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">risultati.</text><rect x="52" y="366" width="491" height="55" fill="#eee9d8"/><path d="M52 366v55" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="381" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">DOMANDA DA DISCUTERE</text><text x="66" y="402" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Ottenere l’effetto desiderato basta a rendere corretta la scelta?</text><text x="52" y="440" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76">Per motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione</text><text x="52" y="458" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76">ragionata può essere discussa; una notizia nuova richiede una fonte.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">85</text></svg>