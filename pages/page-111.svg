<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">DISCIPLINAE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Confini e responsabilità</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La materia nel programma della scuola</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">D.C.A.O.</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Studia riconoscimento delle minacce, difesa, contrasto e giudizio. La formula viene letta insieme</text><text x="52" y="224" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">alle sue conseguenze e ai suoi limiti.</text><text x="52" y="259" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Le altre materie</text><text x="52" y="283" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Il catalogo segue la ripartizione scolastica: Incendio, Diffindo e Verdimillius restano in Incantesimi;</text><text x="52" y="299" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Incarcerous resta in Trasfigurazione. Un collegamento teorico non trasferisce la formula di materia.</text><text x="52" y="334" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Studio e pratica</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Mollicci, creature pericolose e magie sulla memoria non sono pretesti per prove improvvisate. Il</text><text x="52" y="374" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">docente distingue dimostrazione, discussione e lavoro consentito.</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Le informazioni mancanti</text><text x="52" y="433" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Per Fireball il nome suggerisce il tema del fuoco, ma il comportamento specifico in gioco richiede</text><text x="52" y="449" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">conferma. Il corso non inventa gittata, danno o comandi.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">111</text></svg>