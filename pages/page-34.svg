<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Duello, disciplina e reazione</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Annus Tertius</text><text x="297.5" y="213" font-family="Georgia, Times New Roman, serif" font-size="100" fill="#354451" text-anchor="middle">III</text><text x="52" y="273" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#354451" font-style="italic">Esercitare precisione, disarmo e controllo degli effetti, studiando</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#354451" font-style="italic">pericoli di maggiore mole.</text><rect x="52" y="321" width="491" height="71" fill="#eee9d8"/><path d="M52 321v71" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="336" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">L’ANNUALITÀ</text><text x="66" y="357" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Due settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione,</text><text x="66" y="373" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">nozioni e lavoro in aula.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">34</text></svg>