<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola V · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Incarcerous</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno V · Lezione 3 · pagina 70</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Evoca corde che avvolgono il bersaglio e ne limitano i movimenti.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Evoca corde che avvolgono il bersaglio e ne limitano i movimenti. Il contenimento è distinto dallo</text><text x="52" y="276" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">sbilanciamento e dal disarmo: trattenere non significa automaticamente aver concluso il pericolo.</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Bombarda</text><text x="52" y="334" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno VI · Lezione 3 · pagina 84</text><text x="52" y="359" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Produce un’esplosione sul punto colpito.</text><text x="52" y="387" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Produce un’esplosione sul punto colpito. L’effetto può danneggiare un ostacolo, ma coinvolge anche</text><text x="52" y="402" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">materiali, frammenti e ciò che si trova nelle vicinanze. Non equivale a una separazione precisa come un</text><text x="52" y="417" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">taglio.</text><text x="52" y="451" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Confringo</text><text x="52" y="475" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno VI · Lezione 4 · pagina 87</text><text x="52" y="500" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Provoca un’esplosione nel punto o sul bersaglio raggiunto dalla formula.</text><text x="52" y="528" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Il punto dell’impatto e gli effetti sull’ambiente vanno descritti separatamente.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">115</text></svg>