<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">DISCIPLINAE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Confini e responsabilità</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La materia nel programma della scuola</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Il programma annuale</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Tarantallegra e Vermilius vengono affrontati nel secondo anno; Fireball e Confundo nel terzo;</text><text x="52" y="224" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Confringo nel quarto. Ogni annualità comprende quattro incontri.</text><text x="52" y="259" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">I collegamenti fra materie</text><text x="52" y="283" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Diffindo, Incendio e Incarcerous vengono ripresi nel quinto anno per comprenderne l’impiego</text><text x="52" y="299" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">difensivo. La conoscenza di una formula deve essere collegata allo scopo per cui viene usata.</text><text x="52" y="334" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Studio e pratica</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Leggere una descrizione non equivale a padroneggiare una magia. Il docente stabilisce esercizi,</text><text x="52" y="374" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">bersagli e condizioni adatte alla preparazione degli allievi.</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">La responsabilità</text><text x="52" y="433" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Dimostrazioni e attività avanzate richiedono attenzione alle persone presenti. Un caso su tavola</text><text x="52" y="449" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">permette di esercitare il giudizio prima dell’esecuzione.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">115</text></svg>