<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">RELATIO</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il rapporto dopo l’evento</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Informazioni che altri possano verificare</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Luogo e persone</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Indicare quando e dove è avvenuto il fatto, chi era presente e chi ha assunto la responsabilità</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">dell’intervento.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Sequenza osservata</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Descrivere l’ordine degli eventi. Separare ciò che è stato visto da ciò che è stato riferito da altri.</text><text x="52" y="321" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Decisioni e risultati</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Annotare lo scopo delle scelte, gli effetti riscontrati e le indicazioni ricevute.</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Limiti e consegna</text><text x="52" y="405" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Registrare dubbi, condizioni non verificate e compiti affidati a un responsabile.</text><rect x="52" y="422" width="491" height="87" fill="#eee9d8"/><path d="M52 422v87" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="437" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">ESEMPIO IMMAGINARIO</text><text x="66" y="458" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Alla comparsa dell’oggetto, due studenti si allontanano. Non è osservato alcun contatto. Il</text><text x="66" y="474" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">docente dispone di non avvicinarsi e prende in carico la verifica. L’origine dell’oggetto resta</text><text x="66" y="490" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">sconosciuta.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">106</text></svg>