<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">CONSILIUM MAGISTRI</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il consiglio del maestro</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Alla conclusione del percorso</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Conoscere</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Conservate gli appunti delle lezioni e tornate sulle differenze fra gli effetti. La precisione del</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">linguaggio aiuta a riconoscere una minaccia senza lasciarsi guidare soltanto dall’impressione.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Esercitare</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">La costanza non consiste nel ripetere una formula senza attenzione. Ogni prova deve avere un</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">bersaglio riconoscibile, uno scopo e un modo per valutare ciò che è accaduto.</text><text x="52" y="342" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Giudicare</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Saper rinunciare a un intervento sproporzionato è parte della preparazione del difensore. Il valore di</text><text x="52" y="384" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">una decisione si misura anche nelle conseguenze per chi non partecipa al confronto.</text><text x="52" y="421" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Proseguire</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Questi sette anni costituiscono un principio, non il termine dello studio. Cercate il confronto con i</text><text x="52" y="463" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">maestri, dichiarate ciò che non comprendete e custodite la fiducia di chi si affida alla vostra</text><text x="52" y="481" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">protezione.</text><text x="52" y="511" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#354451" font-style="italic">Professor Silas Ravenshaw · Hogwarts · MDCCCXC</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">119</text></svg>