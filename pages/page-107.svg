<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">MEMORIA E RESPONSABILITÀ</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Obliviate · Studio teorico</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Confronto degli ultimi due anni · Nessun esercizio sui ricordi</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Obliviate interviene sui ricordi. La sua conoscenza teorica serve a distinguere una lacuna</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">riferita, una testimonianza e un’ipotesi sulla causa. Nessuna singola dimenticanza dimostra</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">da sola l’impiego di una formula.</text><text x="52" y="250" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Il limite del corso</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Gli allievi non modificano i ricordi dei compagni e non tentano prove per verificare un</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">sospetto. Una possibile alterazione della memoria viene affidata a chi possiede preparazione</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">e responsabilità appropriate.</text><text x="52" y="347" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Una ricostruzione attendibile</text><text x="52" y="371" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Un rapporto utile separa osservazioni, parole della persona e interpretazioni. Non impone</text><text x="52" y="389" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">un ricordo, non assegna automaticamente una causa e non pretende di ricostruire ciò che</text><text x="52" y="407" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">non è stato verificato.</text><rect x="52" y="425" width="491" height="71" fill="#eee9d8"/><path d="M52 425v71" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="440" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">LA CONSEGNA</text><text x="66" y="461" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Studiare una magia non conferisce il diritto di esercitarla. Il confronto teorico del sesto e</text><text x="66" y="477" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">settimo anno sviluppa riconoscimento e giudizio.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">107</text></svg>