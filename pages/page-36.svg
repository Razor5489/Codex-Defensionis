<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">I troll: forza, territorio e prudenza</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Riconoscimento e spazio di ritirata</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">I troll sono creature grandi e molto forti. Le varietà di montagna, foresta e fiume ricordano</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">che una denominazione generale non descrive ogni ambiente e abitudine. La mole impone</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">di considerare sia i movimenti della creatura sia gli ostacoli che possono essere rovesciati.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Un’andatura apparentemente impacciata non rende innocuo un incontro. Avvicinarsi per</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">provare una formula espone al rischio prima ancora di conoscerne il risultato. Le</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">indicazioni di passaggio devono essere considerate insieme: un rumore o un’impronta</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">isolata non costituiscono identificazione certa.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La difesa scolastica privilegia segnalazione, allontanamento ordinato e lettura dei percorsi.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Una scena su tavola consente di discutere le uscite e le persone esposte senza cercare un</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">confronto reale. Conoscere un incantesimo da duello non ne dimostra l’efficacia contro una</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">creatura di grande mole.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma del libro D.C.A.O. di Francis Lake · Anno III · Lezione 1</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">36</text></svg>