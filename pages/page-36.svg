<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Distanza e osservazione</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Leggere il confronto prima di intervenire</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La difesa comincia dal riconoscimento delle persone, dei percorsi e dei cambiamenti del</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">luogo. Prima di scegliere una formula, l’allievo descrive che cosa stia accadendo e quale</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">risultato sia necessario. Un gesto isolato non permette di conoscere ogni intenzione</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">dell’altro.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Una distanza maggiore non costituisce da sola una protezione. Ostacoli, appoggi e presenza</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">dei compagni possono cambiare la possibilità di allontanarsi. L’osservazione prepara il</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">giudizio senza attribuire alla propria scelta un risultato garantito.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La lezione usa casi su tavola e movimenti concordati senza lanciare nuove formule. Gli</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">studenti individuano un percorso, segnalano un ostacolo e spiegano quando chiedere</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">l’intervento del docente. Il terzo anno sviluppa lettura del confronto e controllo dello</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">sbilanciamento.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Silas Ravenshaw · Appunti per il corso di Difesa</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">36</text></svg>