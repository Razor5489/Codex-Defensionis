<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Fireball</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Riconoscimento teorico di una voce del repertorio</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Fireball è collocato nel terzo anno di D.C.A.O. Il nome richiama una sfera di fuoco, ma i</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">materiali disponibili non descrivono il funzionamento preciso della versione in gioco. La</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">voce viene studiata senza attribuirle proprietà aggiuntive.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La denominazione non basta a stabilire traiettoria, impatto, danno o differenze da Incendio.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Il tema del fuoco non rende identiche due formule. Prima di insegnarne l’esecuzione il</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">docente deve confermare effetto, bersaglio e condizioni effettivamente previsti.</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La lezione lavora su una scheda incompleta e su casi immaginari. Gli studenti distinguono</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">ciò che il nome suggerisce da ciò che resta da verificare. Non viene predisposta una pratica</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">autonoma né si attribuisce alla formula una capacità particolare contro una creatura.</text><text x="52" y="375" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma D.C.A.O. rielaborato · Ordinamento concordato della scuola · Hogwarts · 1890</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">36</text></svg>