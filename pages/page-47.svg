<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · LECTIO 4</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Leggere il duello · Scheda della lezione</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Una persona sbilanciata ha perso automaticamente ogni possibilità di risposta?</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">1. Leggere il caso scritto e distinguere fatti e ipotesi.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">2. Indicare bersaglio, persone esposte e risultato necessario.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">3. Motivare una scelta e il momento in cui chiedere l’intervento del docente.</text><text x="52" y="333" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Domanda di ripasso</text><text x="52" y="357" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Una persona sbilanciata ha perso automaticamente ogni possibilità di risposta?</text><text x="52" y="393" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Risposta ragionata</text><text x="52" y="417" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">No. La perdita di equilibrio non cancella volontà, percezione e possibilità di reagire.</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#a9b3bd">Concluso il ciclo di due settimane. Si prosegue con l’anno IV.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">47</text></svg>