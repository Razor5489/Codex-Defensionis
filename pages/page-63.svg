Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Lezione 2 · Fireball</text><text x="536" y="263" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">67</text><path d="M60 271H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Una denominazione da chiarire prima dell’uso</text><text x="52" y="325" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Settimana II</text><!--ROW:9--><text x="60" y="349" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Lezione 3 · La licantropia</text><text x="536" y="349" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">70</text><path d="M60 357H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="377" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Una condizione e un pericolo da distinguere</text><!--ROW:11--><text x="60" y="404" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Lezione 4 · Il ruolo degli Auror</text><text x="536" y="404" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">73</text><path d="M60 412H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="432" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Autorità, preparazione e responsabilità</text><rect x="52" y="447" width="491" height="55" fill="#eee9d8"/><path d="M52 447v55" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="462" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">TRAGUARDO</text><text x="66" y="483" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Distinguere confusione, pericolo e competenza specialistica nel giudizio sulle persone.</text><text x="52" y="521" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Le tre pagine di ogni lezione uniscono spiegazione, nozioni e confronto. Dopo il quarto incontro si</text><text x="52" y="539" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">passa all’annualità successiva.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">63</text></svg>