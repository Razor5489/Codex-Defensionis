<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">CURSUS SEPTEM ANNORUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il percorso delle due settimane</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Quattro incontri per ciascun anno</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Settimana I</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Due lezioni per riconoscere il problema, descrivere gli effetti e distinguere bersagli e</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">condizioni.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Settimana II</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Due lezioni per approfondire il confronto, applicare il metodo e raccogliere il ripasso prima</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">del passaggio all’annualità successiva.</text><rect x="52" y="323" width="491" height="71" fill="#eee9d8"/><path d="M52 323v71" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="338" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">QUINDICI MINUTI</text><text x="66" y="359" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">2 minuti per la domanda iniziale; 5 per spiegazione e nozioni; 5 per attività o dimostrazione; 3</text><text x="66" y="375" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">per confronto e risposta ragionata.</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Tre pagine, una lezione</text><text x="52" y="444" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">La spiegazione, le nozioni e la scheda per l’aula appartengono allo stesso incontro. Il</text><text x="52" y="462" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">repertorio finale facilita il ripasso senza aggiungere lezioni al calendario.</text><text x="52" y="492" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Recuperi, dimostrazioni e verifiche seguono le disposizioni della scuola.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">04</text></svg>