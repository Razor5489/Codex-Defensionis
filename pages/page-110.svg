<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola III · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Vermilius</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno II · Lezione 4 · pagina 31</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Nome assegnato dalla scuola a D.C.A.O.; la corrispondenza con il repertorio delle scintille rosse</text><text x="52" y="249" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">richiede conferma in gioco.</text><text x="52" y="277" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Voce distinta da Verdimilius. Nessun valore tecnico o effetto offensivo è presunto.</text><text x="52" y="311" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Fireball</text><text x="52" y="335" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno III · Lezione 1 · pagina 36</text><text x="52" y="360" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Nome associabile a una sfera di fuoco; il funzionamento della versione in gioco resta da confermare.</text><text x="52" y="388" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Trattazione teorica: non si inventano bersaglio, danno, portata o differenze da Incendio.</text><text x="52" y="422" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Confundo</text><text x="52" y="446" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno III · Lezione 2 · pagina 39</text><text x="52" y="471" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Confonde il bersaglio, alterandone temporaneamente la lucidità o la valutazione della situazione.</text><text x="52" y="499" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">La valutazione della situazione può essere alterata senza cancellare i ricordi.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">110</text></svg>