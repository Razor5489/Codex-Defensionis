<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola IV · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Fireball</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno V · Lezione 2 · pagina 67</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Il nome Fireball richiama una sfera di fuoco. Il repertorio disponibile non ne stabilisce però il</text><text x="52" y="249" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">comportamento specifico.</text><text x="52" y="277" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">La denominazione non basta a fissare traiettoria, impatto o differenze da Incendio. Prima di insegnarne</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">l’uso il docente deve confermare la descrizione della versione disponibile.</text><text x="52" y="326" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Obliviate</text><text x="52" y="350" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno VI · Lezione 1 · pagina 78</text><text x="52" y="375" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Interviene sui ricordi del bersaglio, cancellando o alterando la memoria interessata dall’effetto.</text><text x="52" y="403" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">La memoria si distingue dall’attenzione momentanea. È una materia avanzata: la semplice confusione</text><text x="52" y="418" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">non dimostra che un ricordo sia stato rimosso.</text><text x="52" y="452" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Expecto Patronum</text><text x="52" y="476" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno VII · Lezione 1 · pagina 92</text><text x="52" y="501" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Evoca un Patronus, manifestazione protettiva usata contro i Dissennatori. Una forma corporea può</text><text x="52" y="517" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">assumere un aspetto animale.</text><text x="52" y="545" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Il Patronus non è un animale naturale evocato con Avis. Il suo studio collega concentrazione e richiamo</text><text x="52" y="560" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">di un ricordo felice, senza garantire una forma corporea a ogni tentativo.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">110</text></svg>