<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · LECTIO 2</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Fireball · Scheda della lezione</text><rect x="52" y="165" width="491" height="71" fill="#eee9d8"/><path d="M52 165v71" stroke="#a9b3bd" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#354451" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Una formula il cui nome richiama il fuoco produce necessariamente gli stessi risultati delle</text><text x="66" y="217" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">altre?</text><text x="52" y="255" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">1. Elencare ciò che il nome permette soltanto di ipotizzare.</text><text x="52" y="284" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">2. Separarlo dalle informazioni da chiedere al docente.</text><text x="52" y="313" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">3. Rifiutare di completare la scheda con valori o capacità inventate.</text><text x="52" y="349" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Domanda di ripasso</text><text x="52" y="373" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#30363d">Perché la voce non riceve una pratica autonoma descritta nel testo?</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Risposta ragionata</text><text x="52" y="433" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Perché il funzionamento specifico non è documentato dai materiali disponibili. Prima della pratica</text><text x="52" y="449" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">serve una descrizione confermata.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">69</text></svg>