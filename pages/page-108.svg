<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola II · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Everte Statum</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno II · Lezione 2 · pagina 25</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Respinge e sbilancia il bersaglio, provocandone un arretramento o una caduta secondo l’esecuzione.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Sbilanciamento e immobilizzazione non coincidono. Un bersaglio spostato può conservare capacità di</text><text x="52" y="276" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">movimento.</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Tarantallegra</text><text x="52" y="334" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno II · Lezione 3 · pagina 28</text><text x="52" y="359" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Costringe le gambe del bersaglio a un movimento incontrollato simile a una danza.</text><text x="52" y="387" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">L’effetto riguarda il movimento imposto degli arti; si distingue dal semplice sbilanciamento e non</text><text x="52" y="402" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">implica il controllo generale della persona.</text><text x="52" y="436" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Petrificus</text><text x="52" y="460" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno III · Lezione 1 · pagina 36</text><text x="52" y="485" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Nel catalogo indica la formula di immobilizzazione del corpo. Il bersaglio viene irrigidito e limitato</text><text x="52" y="501" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">nei movimenti.</text><text x="52" y="529" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Si conserva il nome mostrato dalla scuola. Immobilizzazione, perdita di coscienza e trasformazione in</text><text x="52" y="544" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">pietra sono concetti diversi.</text><text x="52" y="578" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Colloshoo</text><text x="52" y="602" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno III · Lezione 2 · pagina 39</text><text x="52" y="627" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Incolla o fissa le scarpe del bersaglio al terreno, ostacolandone lo spostamento.</text><text x="52" y="655" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Un vincolo agli appoggi non equivale all’immobilizzazione di tutto il corpo. Il punto sul quale agisce</text><text x="52" y="670" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">l’effetto aiuta a classificarlo.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">108</text></svg>