<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIUM</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Effetti e nozioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Tavola I · Consultazione delle formule</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Rictusempra</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno I · Lezione 2 · pagina 11</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Provoca solletico nel bersaglio, interferendo con la sua capacità di mantenere la concentrazione.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Il solletico è l’effetto centrale, non un controllo generale della mente.</text><text x="52" y="295" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Flipendo</text><text x="52" y="319" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno I · Lezione 3 · pagina 14</text><text x="52" y="344" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Colpisce con un impulso capace di respingere o rovesciare il bersaglio.</text><text x="52" y="372" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Produce movimento o rovesciamento, non una guida libera e continua.</text><text x="52" y="406" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#354451" font-weight="bold">Protego</text><text x="52" y="430" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Anno I · Lezione 4 · pagina 17</text><text x="52" y="455" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#30363d">Genera uno scudo magico difensivo, utile a contrastare effetti compatibili con la protezione.</text><text x="52" y="483" font-family="Georgia, Times New Roman, serif" font-size="10.5" fill="#30363d">Uno scudo è una difesa attiva da valutare rispetto all’effetto affrontato.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">108</text></svg>