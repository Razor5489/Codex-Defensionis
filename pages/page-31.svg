<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#0e141a"/><stop offset=".12" stop-color="#394652"/><stop offset=".6" stop-color="#232f3b"/><stop offset="1" stop-color="#090e14"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">CODEX DEFENSIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#a9b3bd">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#a9b3bd" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#354451" font-weight="bold">Vermilius</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La formula del programma: distinzione da Verdimilius</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Vermilius viene assegnato a D.C.A.O. nella seconda settimana del secondo anno. Nei</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">repertori la denominazione Vermillious è associata a scintille rosse. La corrispondenza con</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">il nome e l’effetto specifici disponibili nel server richiede conferma del docente: non si</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">trasferiscono automaticamente tutte le proprietà di una versione a un’altra.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Vermilius e Verdimilius restano due voci separate. Verdimilius conserva il primo anno di</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Incantesimi; la somiglianza dei nomi non permette di sostituirlo alla formula assegnata qui.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">Un segnale visibile, una luce e un effetto offensivo sono funzioni differenti da descrivere</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">prima della pratica.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">L’attività confronta nomi, descrizioni disponibili e dati mancanti. Finché non è confermata</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">la versione in uso, la lezione rimane teorica e non stabilisce danni, gittata, durata o</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">movimento di bacchetta. Il docente completa la scheda prima di predisporre una</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#30363d">dimostrazione.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma D.C.A.O. rielaborato · Ordinamento concordato della scuola · Hogwarts · 1890</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">DEFENSIO · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">31</text></svg>