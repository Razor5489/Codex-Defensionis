 allievo una figura animale completa né una forma scelta liberamente. La preparazione mentale e il ricordo felice vengono studiati senza richiedere rivelazioni personali alla classe.\nRiferimento: Silas Ravenshaw · Appunti per il corso di Difesa", "title": "Expecto Patronum", "folio": "101", "kind": "theory"}, {"image": "pages/page-102.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nAnno VII · Lectio 4\nLe nozioni da ricordare\nExpecto Patronum\nManifestazione\nIl Patronus non è un animale naturale trasformato o evocato per la cura.\nPreparazione\nRicordo e concentrazione sostengono la nozione senza garantire un risultato immediato.\nRiservatezza\nUn compito mentale non richiede di raccontare alla classe esperienze private.\nDomanda da discutere\nLa capacità di una formula offensiva dimostra già la padronanza del Patronus?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.", "title": "Expecto Patronum · Nozioni", "folio": "102", "kind": "theory"}, {"image": "pages/page-103.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nAnno VII · Lectio 4\nIl confronto in aula\nExpecto Patronum · Scheda della lezione\nApertura\nLa capacità di una formula offensiva dimostra già la padronanza del Patronus?\n1. Distinguere su tavola manifestazione luminosa e forma corporea.\n2. Formulare un progetto teorico senza scegliere una specie animale come promessa di riuscita.\n3. Indicare i limiti della propria preparazione rispetto alla dimostrazione del docente.\nDomanda di ripasso\nConoscere la formula garantisce un Patronus corporeo?\nRisposta ragionata\nNo. Il risultato richiede una padronanza avanzata che non deriva dalla sola lettura.\nConcluso il ciclo di due settimane. Il percorso dei sette anni è concluso.", "title": "Expecto Patronum · Attività e ripasso", "folio": "103", "kind": "theory"}, {"image": "pages/page-104.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nLettura complementare\nI troll: forza, territorio e prudenza\nCollegamento teorico · Non aggiunge incontri al calendario\nI troll sono creature grandi e molto forti. Le varietà di montagna, foresta e fiume ricordano che una denominazione generale non descrive ogni ambiente e abitudine. La mole impone di considerare sia i movimenti della creatura sia gli ostacoli che possono essere rovesciati.\nUn’andatura apparentemente impacciata non rende innocuo un incontro. Avvicinarsi per provare una formula espone al rischio prima ancora di conoscerne il risultato. Le indicazioni di passaggio devono essere considerate insieme: un rumore o un’impronta isolata non costituiscono identificazione certa.\nLa difesa scolastica privilegia segnalazione, allontanamento ordinato e lettura dei percorsi. Una scena su tavola consente di discutere le uscite e le persone esposte senza cercare un confronto reale. Conoscere un incantesimo da duello non ne dimostra l’efficacia contro una creatura di grande mole.\nIl collegamento\nQuesta lettura confronta conoscenze già affrontate. Non introduce un secondo apprendimento della formula e non estende la pratica a nuovi bersagli.", "title": "I troll: forza, territorio e prudenza", "folio": "104", "kind": "theory"}, {"image": "pages/page-105.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nLettura complementare\nDiffindo · Applicazione difensiva\nCollegamento teorico · Non aggiunge incontri al calendario\nProduce un taglio sul materiale verso cui è diretto. In un problema difensivo può essere studiato per comprendere come rimuovere un ostacolo, ma il risultato dipende dal bersaglio e da ciò che si trova vicino.\nTagliare una fune modifica anche ciò che quella fune sostiene. Il punto da separare e le conseguenze successive sono entrambi parte del compito.\nIl docente propone materiali inanimati preparati e una tavola con carichi e ingombri. Prima della dimostrazione gli studenti indicano che cosa si trova dietro il bersaglio e confrontano la separazione magica con una soluzione più semplice.\nIl collegamento\nQuesta lettura confronta conoscenze già affrontate. Non introduce un secondo apprendimento della formula e non estende la pratica a nuovi bersagli.", "title": "Diffindo · Applicazione difensiva", "folio": "105", "kind": "theory"}, {"image": "pages/page-106.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nLettura complementare\nIncendio · Applicazione difensiva\nCollegamento teorico · Non aggiunge incontri al calendario\nGenera una fiamma. La lezione studia l’accensione insieme alle condizioni che possono trasformarla in propagazione: materiali vicini, spazio e possibilità di tenere sotto controllo il risultato.\nFuoco e calore non sono risposte adatte a ogni minaccia. Una formula efficace sul materiale scelto può creare un problema maggiore se il contesto non è stato preparato.\nIl lavoro parte dal riconoscimento dei materiali su tavola. Un’eventuale dimostrazione è predisposta dal docente; gli studenti non cercano di provare una difesa incendiando un ambiente o esponendo persone e creature.\nIl collegamento\nQuesta lettura confronta conoscenze già affrontate. Non introduce un secondo apprendimento della formula e non estende la pratica a nuovi bersagli.", "title": "Incendio · Applicazione difensiva", "folio": "106", "kind": "theory"}, {"image": "pages/page-107.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nMemoria e responsabilità\nObliviate · Studio teorico\nConfronto degli ultimi due anni · Nessun esercizio sui ricordi\nObliviate interviene sui ricordi. La sua conoscenza teorica serve a distinguere una lacuna riferita, una testimonianza e un’ipotesi sulla causa. Nessuna singola dimenticanza dimostra da sola l’impiego di una formula.\nIl limite del corso\nGli allievi non modificano i ricordi dei compagni e non tentano prove per verificare un sospetto. Una possibile alterazione della memoria viene affidata a chi possiede preparazione e responsabilità appropriate.\nUna ricostruzione attendibile\nUn rapporto utile separa osservazioni, parole della persona e interpretazioni. Non impone un ricordo, non assegna automaticamente una causa e non pretende di ricostruire ciò che non è stato verificato.\nLa consegna\nStudiare una magia non conferisce il diritto di esercitarla. Il confronto teorico del sesto e settimo anno sviluppa riconoscimento e giudizio.", "title": "Obliviate · Studio teorico", "folio": "107", "kind": "theory"}, {"image": "pages/page-108.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nConsilium\nScegliere una difesa\nUna decisione proporzionata alla situazione\nRiconoscere\nDescrivere ciò che si vede prima di attribuirgli una causa. Distinguere un movimento, un effetto magico e una reazione di paura.\nProteggere\nIndividuare persone esposte e possibilità di allontanamento. Una formula difensiva richiede comunque direzione, attenzione e condizioni adatte.\nInterrompere\nDisarmare, sbilanciare e distrarre producono risultati diversi. Scegliere in rapporto al problema, senza confondere la varietà delle formule con la qualità del giudizio.\nVerificare\nOsservare ciò che è cambiato. Un effetto visibile non dimostra da solo che il pericolo sia concluso.\nCaso immaginario\nUn compagno perde la bacchetta mentre un altro arretra verso una scala. La classe discute prima le persone esposte e lo spazio disponibile, poi le formule eventualmente pertinenti.", "title": "Scegliere una difesa", "folio": "108", "kind": "theory"}, {"image": "pages/page-109.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRelatio\nIl rapporto dopo l’evento\nInformazioni che altri possano verificare\nLuogo e persone\nIndicare quando e dove è avvenuto il fatto, chi era presente e chi ha assunto la responsabilità dell’intervento.\nSequenza osservata\nDescrivere l’ordine degli eventi. Separare ciò che è stato visto da ciò che è stato riferito da altri.\nDecisioni e risultati\nAnnotare lo scopo delle scelte, gli effetti riscontrati e le indicazioni ricevute.\nLimiti e consegna\nRegistrare dubbi, condizioni non verificate e compiti affidati a un responsabile.\nEsempio immaginario\nAlla comparsa dell’oggetto, due studenti si allontanano. Non è osservato alcun contatto. Il docente dispone di non avvicinarsi e prende in carico la verifica. L’origine dell’oggetto resta sconosciuta.", "title": "Il rapporto dopo l’evento", "folio": "109", "kind": "theory"}, {"image": "pages/page-110.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nFormulae\nLe formule per anno\nLe formule del programma aggiornato\nI · Rictusempra 11\nI · Protego 17\nII · Riddikulus 25\nII · Coloshoo 25\nII · Tarantallegra 28\nIII · Flipendo 36\nIII · Vermilius 39\nIII · Ventus 42\nIV · Fireball 56\nIV · Evertestatum 59\nV · Confundo 64\nV · Petrificus 67\nV · Incarcerous 70\nVI · Bombarda 84\nVI · Expelliarmus 87\nVII · Expulso 98\nVII · Expecto Patronum 101\nLa tavola indica la prima introduzione. I programmi annuali precisano settimane e approfondimenti. Confringo appartiene al terzo anno di Incantesimi ed è richiamato qui soltanto per confronto.", "title": "Le formule per anno", "folio": "110", "kind": "theory"}, {"image": "pages/page-111.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRepertorium\nEffetti e nozioni\nTavola I · Consultazione delle formule\nRictusempra\nAnno I · Lezione 2 · pagina 11\nProvoca solletico nel bersaglio, interferendo con la sua capacità di mantenere la concentrazione.\nIl solletico è l’effetto centrale, non un controllo generale della mente.\nProtego\nAnno I · Lezione 4 · pagina 17\nGenera uno scudo magico difensivo, utile a contrastare effetti compatibili con la protezione.\nUno scudo è una difesa attiva da valutare rispetto all’effetto affrontato.\nRiddikulus\nAnno II · Lezione 2 · pagina 25\nContrasta un Molliccio trasformandone l’apparenza in qualcosa di comico, sostenuto dall’immaginazione di chi lo affronta.\nLa forma osservata dipende dall’incontro e non definisce un aspetto stabile noto.", "title": "Effetti e nozioni", "folio": "111", "kind": "theory"}, {"image": "pages/page-112.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRepertorium\nEffetti e nozioni\nTavola II · Consultazione delle formule\nColoshoo\nAnno II · Lezione 2 · pagina 25\nIncolla o fissa le scarpe del bersaglio al terreno, ostacolandone lo spostamento.\nIl punto d’azione è essenziale per distinguere la formula da un’immobilizzazione generale.\nTarantallegra\nAnno II · Lezione 3 · pagina 28\nCostringe le gambe del bersaglio a un movimento incontrollato simile a una danza.\nL’effetto descritto riguarda le gambe, non ogni azione della persona.\nFlipendo\nAnno III · Lezione 1 · pagina 36\nColpisce con un impulso capace di respingere o rovesciare il bersaglio.\nProduce movimento o rovesciamento, non una guida libera e continua.", "title": "Effetti e nozioni", "folio": "112", "kind": "theory"}, {"image": "pages/page-113.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRepertorium\nEffetti e nozioni\nTavola III · Consultazione delle formule\nVermilius\nAnno III · Lezione 2 · pagina 39\nFormula associata nei trattati a scintille rosse.\nDistinguere Vermilius da Verdimilius e descrivere la manifestazione prima di interpretarne lo scopo.\nVentus\nAnno III · Lezione 3 · pagina 42\nGenera una corrente di vento diretta, studiata su materiali leggeri e oggetti inanimati.\nIl vento agisce sull’ambiente attraversato: direzione, ostacoli e oggetti vicini contribuiscono al risultato. Si distingue dalla spinta concentrata di Depulso su un bersaglio.\nFireball\nAnno IV · Lezione 3 · pagina 56\nManifestazione associata a una sfera di fuoco, studiata per il riconoscimento e il giudizio difensivo.\nQuarto anno: riconoscimento e dimostrazione circoscritta. Nessuna pratica di effetti estesi o propagazione.", "title": "Effetti e nozioni", "folio": "113", "kind": "theory"}, {"image": "pages/page-114.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRepertorium\nEffetti e nozioni\nTavola IV · Consultazione delle formule\nEvertestatum\nAnno IV · Lezione 4 · pagina 59\nRespinge e sbilancia il bersaglio, provocandone un arretramento o una caduta secondo l’esecuzione.\nLa posizione del bersaglio influenza le conseguenze del movimento.\nConfundo\nAnno V · Lezione 1 · pagina 64\nConfonde il bersaglio, alterandone temporaneamente la lucidità o la valutazione della situazione.\nLa confusione non conferisce controllo dei pensieri, delle decisioni o dei ricordi. Il quinto anno ne studia riconoscimento e responsabilità.\nPetrificus\nAnno V · Lezione 2 · pagina 67\nPetrificus immobilizza il corpo del bersaglio.\nDistinguere immobilità, coscienza e volontà; chiarire condizioni e ripristino prima di una prova.", "title": "Effetti e nozioni", "folio": "114", "kind": "theory"}, {"image": "pages/page-115.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRepertorium\nEffetti e nozioni\nTavola V · Consultazione delle formule\nIncarcerous\nAnno V · Lezione 3 · pagina 70\nEvoca corde che avvolgono il bersaglio e ne limitano i movimenti.\nEvoca corde che avvolgono il bersaglio e ne limitano i movimenti. Il contenimento è distinto dallo sbilanciamento e dal disarmo: trattenere non significa automaticamente aver concluso il pericolo.\nBombarda\nAnno VI · Lezione 3 · pagina 84\nProduce un’esplosione sul punto colpito.\nProduce un’esplosione sul punto colpito. L’effetto può danneggiare un ostacolo, ma coinvolge anche materiali, frammenti e ciò che si trova nelle vicinanze. Non equivale a una separazione precisa come un taglio.\nExpelliarmus\nAnno VI · Lezione 4 · pagina 87\nDisarma il bersaglio, facendogli perdere la presa sulla bacchetta o sull’oggetto interessato dall’effetto.\nÈ il rapporto tra il bersaglio e l’oggetto che impugna.", "title": "Effetti e nozioni", "folio": "115", "kind": "theory"}, {"image": "pages/page-116.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nRepertorium\nEffetti e nozioni\nTavola VI · Consultazione delle formule\nExpulso\nAnno VII · Lezione 3 · pagina 98\nProduce un effetto esplosivo sul bersaglio o nel punto colpito.\nNon coincide con un trasporto ordinato del bersaglio.\nExpecto Patronum\nAnno VII · Lezione 4 · pagina 101\nEvoca un Patronus, manifestazione protettiva usata contro i Dissennatori.\nIl Patronus non è un animale naturale trasformato o evocato per la cura.", "title": "Effetti e nozioni", "folio": "116", "kind": "theory"}, {"image": "pages/page-117.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nDisciplinae\nConfini e responsabilità\nLa materia nel programma della scuola\nIl programma annuale\nIl terzo anno studia Flipendo, Vermilius e Ventus, con un incontro di ripasso. Il quarto affronta creature, Fireball ed Evertestatum. Confundo, Petrificus e Incarcerous sono al quinto; Bombarda ed Expelliarmus al sesto.\nI collegamenti fra materie\nDiffindo e Incendio sono richiamati nelle letture complementari come applicazioni di formule già apprese. Incarcerous è studiato nel quinto anno anche in Trasfigurazione: una stessa formula può avere contesti diversi, senza un secondo apprendimento.\nStudio e pratica\nLeggere una descrizione non equivale a padroneggiare una magia. Il docente stabilisce esercizi, bersagli e condizioni adatte alla preparazione degli allievi.\nLa responsabilità\nDimostrazioni e attività avanzate richiedono attenzione alle persone presenti. Un caso su tavola permette di esercitare il giudizio prima dell’esecuzione.", "title": "Confini e responsabilità", "folio": "117", "kind": "theory"}, {"image": "pages/page-118.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nLexicon\nLe parole della difesa\nUn lessico da usare con precisione\nMinaccia\nUna condizione capace di produrre un danno, da valutare nel suo contesto.\nBersaglio\nPersona, oggetto o effetto a cui è diretto l’intervento.\nProtezione\nAzione volta a ridurre l’esposizione; non coincide con invulnerabilità.\nDisarmo\nPerdita della presa sulla bacchetta o sull’oggetto interessato.\nSbilanciamento\nAlterazione dell’equilibrio, distinta dall’immobilizzazione.\nControllo\nCapacità di mantenere lo scopo e verificare le conseguenze dell’azione.\nProporzione\nRapporto ragionato fra problema, risultato necessario e conseguenze previste.", "title": "Le parole della difesa", "folio": "118", "kind": "theory"}, {"image": "pages/page-119.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nConsilium Magistri\nIl consiglio del maestro\nAlla conclusione del percorso\nConoscere\nConservate gli appunti delle lezioni e tornate sulle differenze fra gli effetti. La precisione del linguaggio aiuta a riconoscere una minaccia senza lasciarsi guidare soltanto dall’impressione.\nEsercitare\nLa costanza non consiste nel ripetere una formula senza attenzione. Ogni prova deve avere un bersaglio riconoscibile, uno scopo e un modo per valutare ciò che è accaduto.\nGiudicare\nSaper rinunciare a un intervento sproporzionato è parte della preparazione del difensore. Il valore di una decisione si misura anche nelle conseguenze per chi non partecipa al confronto.\nProseguire\nQuesti sette anni costituiscono un principio, non il termine dello studio. Cercate il confronto con i maestri, dichiarate ciò che non comprendete e custodite la fiducia di chi si affida alla vostra protezione.\nProfessor Silas Ravenshaw · Hogwarts · MDCCCXC", "title": "Il consiglio del maestro", "folio": "119", "kind": "theory"}, {"image": "pages/page-120.svg?v=20261128-terzoanno", "text": "CODEX DEFENSIONIS\nFinis\nConoscere la minaccia.\nScegliere con giudizio.\nSette annualità. Quattordici settimane. Ventotto lezioni per riconoscere, proteggere e comprendere le conseguenze delle proprie decisioni.\nSilas Ravenshaw\nHogwarts · MDCCCXC", "title": "Conoscere la minaccia.", "folio": "120", "kind": "theory"}, {"image": "pages/page-121.svg?v=20261128-terzoanno", "text": "Controguardia posteriore marmorizzata.", "title": "Controguardia posteriore", "folio": "Controguardia", "kind": "endpaper"}, {"image": "pages/page-122.svg?v=20261128-terzoann
